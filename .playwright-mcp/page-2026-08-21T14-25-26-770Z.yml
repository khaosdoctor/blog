        - paragraph [ref=f1e544]:
          - text: If, instead of a string, the value were an Array, every new item added to that array would return a new array. That’s easy to picture if you think about how the Array’s
          - code [ref=f1e545]: slice
          - text: function returns a new array that’s a subset of the original one.
        - paragraph [ref=f1e546]: Libraries like ImmutableJS do this job really well. And the big advantage of immutability is exactly that you get much tighter control over your application, because you have complete control over every step of the data flow, to the point where you can roll back to any previous value at any moment.
        - paragraph [ref=f1e547]: Of course that comes at a cost. Each new version of your variable takes up extra space in memory, and if you don’t clean up your previous states, you can end up with some performance problems.
        - heading [level=2] [ref=f1e548]:
          - text: Immutable collections
          - link "link to this section" [ref=f1e549] [cursor=pointer]:
            - /url: "#immutable-collections"
            - text: "#"
        - paragraph [ref=f1e550]: So far so good, but what’s the big idea behind talking so much about immutability when the whole point of this post is two new collections? Because that factor makes all the difference when we’re talking about objects and arrays, especially in JavaScript.
        - paragraph [ref=f1e551]:
          - text: Tuples and Records work the same way as regular Arrays or Objects. The biggest difference is that we don’t have the
          - emphasis [ref=f1e552]: “in place”
          - text: mutation operators, that is, the functions that change the original value itself, like
          - code [ref=f1e553]: Array.push
          - text: or
          - code [ref=f1e554]: Array.splice
          - text: ". If we try to create a tuple and modify that value, or a record and try to do the same, we’ll get an error:"
        - figure [ref=f1e556]:
          - generic [ref=f1e557]:
            - code [ref=f1e558]:
              - generic [ref=f1e559]:
                - generic [ref=f1e560]: "1"
                - generic [ref=f1e561]: "let record = #{"
