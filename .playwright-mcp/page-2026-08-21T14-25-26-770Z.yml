          - button "Copy to clipboard" [ref=f1e710] [cursor=pointer]
        - paragraph [ref=f1e712]:
          - text: The difference is that tuples have one extra method,
          - code [ref=f1e713]: with
          - text: ", which lets us add (or concatenate) values at the end of the tuple:"
        - figure [ref=f1e715]:
          - generic [ref=f1e716]:
            - code [ref=f1e717]:
              - generic [ref=f1e718]:
