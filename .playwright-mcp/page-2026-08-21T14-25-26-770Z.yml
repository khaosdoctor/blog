        - heading [level=2] [ref=f1e588]:
          - text: Comparison by value
          - link "link to this section" [ref=f1e589] [cursor=pointer]:
            - /url: "#comparison-by-value"
            - text: "#"
        - paragraph [ref=f1e590]: One of the biggest issues I get asked about by a lot of people over the years is the fact that JavaScript compares objects and arrays by reference. I already went over this quickly in an article I published about prototypes and inheritance.
        - paragraph [ref=f1e591]:
          - text: The idea is that when we compare two objects or two arrays (or even other structures that end up being converted to the object type), we’ll always get
          - code [ref=f1e592]: "false"
          - text: "as the answer:"
        - figure [ref=f1e594]:
          - generic [ref=f1e595]:
            - code [ref=f1e596]:
              - generic [ref=f1e597]:
                - generic [ref=f1e598]: "1"
                - generic [ref=f1e599]:
                  - text: console.log
                  - generic [ref=f1e600]: "({"
                  - text: "a: 1 } === { a: 1"
                  - generic [ref=f1e601]: "})"
                  - text: // false
              - generic [ref=f1e602]:
                - generic [ref=f1e603]: "2"
                - generic [ref=f1e604]: console.log(['a'] === ['a']) // false
            - text: js
          - button "Copy to clipboard" [ref=f1e606] [cursor=pointer]
        - paragraph [ref=f1e608]:
          - text: A lot of people think this behavior is a language bug and that it should be fixed if we used the simple comparison,
          - code [ref=f1e609]: ==
          - text: ", instead of"
          - code [ref=f1e610]: ===
          - text: . But the problem isn’t the types, it’s the reference.
        - paragraph [ref=f1e611]: For JavaScript, two objects or arrays are equal if they point to the same memory reference, which is never possible when we compare two object literals like these, because every time we create a new object, we get a new object created and, therefore, a new memory address, so we’ll never get a true comparison.
        - blockquote [ref=f1e612]:
          - text: “
          - paragraph [ref=f1e613]: At this point we could even say that JavaScript makes object creation, in effect, immutable.
          - button "copy this quote" [ref=f1e614] [cursor=pointer]
        - paragraph [ref=f1e615]:
          - text: "And that’s where one of the most important and most useful features of these new primitives comes in:"
          - strong [ref=f1e616]: Tuples and Records are compared by value
          - text: .
        - paragraph [ref=f1e617]: "Since we’re dealing with content that’s immutable, JavaScript can now naturally compare the two objects directly by value. That means we can compare something like this:"
        - figure [ref=f1e619]:
          - generic [ref=f1e620]:
            - code [ref=f1e621]:
              - generic [ref=f1e622]:
                - generic [ref=f1e623]: "1"
                - generic [ref=f1e624]: "#{a:1} === #{a:1} // true"
              - generic [ref=f1e625]:
                - generic [ref=f1e626]: "2"
                - generic [ref=f1e627]: "#[1, 2, 3] === #[1, 2, 3] // true"
            - text: js
          - button "Copy to clipboard" [ref=f1e629] [cursor=pointer]
        - paragraph [ref=f1e631]:
          - text: That makes the whole object comparison process much easier than having to compare objects by their text representation with the classic
          - code [ref=f1e632]: JSON.stringify
          - text: .
        - heading [level=2] [ref=f1e633]:
          - text: Manipulating Tuples and Records
          - link "link to this section" [ref=f1e634] [cursor=pointer]:
            - /url: "#manipulating-tuples-and-records"
            - text: "#"
        - paragraph [ref=f1e635]:
          - text: As I explained before, tuples and records have exactly the same methods as objects and arrays. The difference is that we won’t be able to add new values or modify existing ones, so methods like
          - code [ref=f1e636]: push
          - text: don’t exist in this context. Still, it’s possible to manipulate and even extend the values of these objects in a much easier way.
        - paragraph [ref=f1e637]:
          - text: We can use the
          - strong [ref=f1e638]: rest
          - text: "modifier on both tuples and objects to create a new instance of these values without modifying the previous one. That lets us add and modify values on the fly without writing as much code. For example, if we have a record like this:"
        - figure [ref=f1e640]:
          - generic [ref=f1e641]:
            - code [ref=f1e642]:
              - generic [ref=f1e643]:
                - generic [ref=f1e644]: "1"
                - generic [ref=f1e645]:
                  - text: const
                  - generic [ref=f1e646]: record
                  - text: "= #{"
              - generic [ref=f1e647]:
                - generic [ref=f1e648]: "2"
                - generic [ref=f1e649]: "nome: 'Lucas'"
              - generic [ref=f1e651]:
                - generic [ref=f1e652]: "3"
                - generic [ref=f1e653]: "}"
            - text: js
          - button "Copy to clipboard" [ref=f1e655] [cursor=pointer]
        - paragraph [ref=f1e657]:
          - text: And now we want to add the
          - code [ref=f1e658]: idade
          - text: "property, we can do this:"
        - figure [ref=f1e660]:
