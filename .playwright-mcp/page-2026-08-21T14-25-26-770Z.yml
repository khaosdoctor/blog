        - paragraph [ref=f1e483]: Immutability is a trait that’s becoming more and more common in most systems built today, but, just like collections, it’s actually been around for a long time.
        - paragraph [ref=f1e484]:
          - text: The idea behind creating an immutable object is that, as the name says, it never changes throughout its lifetime. But that doesn’t mean you can never alter the variable again once it’s created. What happens is that its
          - strong [ref=f1e485]: original
          - text: value is never changed.
        - paragraph [ref=f1e486]:
          - text: In practice, an immutable variable would create a copy of itself on every operation performed on it. We already have some kinds of immutability in JavaScript with functions like
          - code [ref=f1e487]: map
          - text: ","
          - code [ref=f1e488]: slice
          - text: ","
