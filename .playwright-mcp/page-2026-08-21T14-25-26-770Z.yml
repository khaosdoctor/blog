          - button "Copy to clipboard" [ref=f1e727] [cursor=pointer]
        - paragraph [ref=f1e729]: "And, just to make it even clearer, we can work with any of these new objects as if they were regular arrays or objects. We can even forget they’re a new type at all:"
        - figure [ref=f1e731]:
