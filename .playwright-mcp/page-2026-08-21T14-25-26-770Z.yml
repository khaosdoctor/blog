        - paragraph [ref=f1e415]:
          - text: Records and Tuples aren’t new in programming. Other languages already use this kind of primitive to represent values we call
          - strong [ref=f1e416]: collections
          - text: . Just like Arrays and Objects, a Tuple (or “tupla” in Portuguese) or a Record are also sets of values grouped into a single memory address.
        - paragraph [ref=f1e417]:
          - text: The difference between these primitives and the ones we already have, like Array and Object, is that they’re
