        - heading [level=2] [ref=f1e760]:
          - text: How can I start using it?
          - link "link to this section" [ref=f1e761] [cursor=pointer]:
            - /url: "#how-can-i-start-using-it"
            - text: "#"
        - paragraph [ref=f1e762]: This proposal is still at stage 2, which means it’s relatively stable and has a working implementation, but it’s still not considered an official one. So it’s not present yet in any of the major players out there, like Node.js or browsers such as Mozilla Firefox, Chrome, and Edge.
        - paragraph [ref=f1e763]:
          - text: But part of being a stage 2 proposal is that it needs a working
          - emphasis [ref=f1e764]: polyfill
          - text: (a “fake” implementation that fully mimics the functionality using features already present in the language). So you can
          - link "use this polyfill" [ref=f1e765] [cursor=pointer]:
            - /url: https://babeljs.io/docs/en/babel-plugin-proposal-record-and-tuple#docsNav
          - text: and start testing the feature right now!
        - heading [level=2] [ref=f1e766]:
          - text: Conclusion
          - link "link to this section" [ref=f1e767] [cursor=pointer]:
            - /url: "#conclusion"
            - text: "#"
        - paragraph [ref=f1e768]:
          - text: The proposal is still a work in progress. There’s even
          - link "an issue open since 2019" [ref=f1e769] [cursor=pointer]:
            - /url: https://github.com/tc39/proposal-record-tuple/issues/10
          - text: to decide whether tuples and records will be created through keywords like
          - code [ref=f1e770]: immutable
          - text: or
          - code [ref=f1e771]: fixed
          - text: ", or through object literals, like I explained above."
        - paragraph [ref=f1e772]:
          - text: On top of that, the keywords
          - code [ref=f1e773]: tuple
          - text: and
          - code [ref=f1e774]: record
          - text: already exist in type systems like TypeScript, and they might clash in some way, something that’s also
          - link "being discussed" [ref=f1e775] [cursor=pointer]:
            - /url: https://github.com/tc39/proposal-record-tuple/issues/9
          - text: since 2020.
        - paragraph [ref=f1e776]: The bottom line is that all of this is still pretty early, but the proposal is getting close to a conclusion, and you can help establish JavaScript’s next data type!
