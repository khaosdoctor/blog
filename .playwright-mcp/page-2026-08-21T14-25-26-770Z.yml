                - generic [ref=f1e673]: "}"
              - generic [ref=f1e674]: "4"
              - generic [ref=f1e677]:
                - generic [ref=f1e678]: "5"
                - generic [ref=f1e679]:
                  - text: const
                  - generic [ref=f1e680]: recordComIdade
                  - text: "= #{"
              - generic [ref=f1e681]:
                - generic [ref=f1e682]: "6"
                - generic [ref=f1e683]: ...record,
              - generic [ref=f1e684]:
                - generic [ref=f1e685]: "7"
                - generic [ref=f1e686]: "idade: 26"
              - generic [ref=f1e688]:
                - generic [ref=f1e689]: "8"
                - generic [ref=f1e690]: "}"
            - text: js
          - button "Copy to clipboard" [ref=f1e692] [cursor=pointer]
        - paragraph [ref=f1e694]: In other words, the same way we naturally do with objects, just immutably.
        - paragraph [ref=f1e695]: "The same goes for tuples:"
        - figure [ref=f1e697]:
          - generic [ref=f1e698]:
            - code [ref=f1e699]:
              - generic [ref=f1e700]:
                - generic [ref=f1e701]: "1"
