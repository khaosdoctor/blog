name: Deploy

on:
  push:
    branches: [main]
  # The Cloudflare Worker fires this at a scheduled post's exact pubDate.
  repository_dispatch:
    types: [scheduled-publish]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push wins; a half-finished deploy is never left running.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: withastro/action@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
