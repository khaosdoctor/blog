name: Build

# Only the events that can publish. A pull request goes to Verify, which is
# where every check lives now.
on:
  push:
    branches: [main]
  # The Cloudflare Worker fires this at a scheduled post's exact pubDate.
  repository_dispatch:
    types: [scheduled-publish]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to Pages as well as build
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancels: the Worker that fires scheduled-publish has a 60 second window
# and no persistence, so cancelling that run means the post never publishes.
concurrency:
  group: pages-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The astro-cache prune step below needs actions:write on top of the
    # workflow default.
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    steps:
      # Full history and tags: the footer version is the last release tag plus
      # the number of commits since it, and a shallow checkout can see neither.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm

      # Astro's content and image caches. Image work dominates this build, 1400
      # webp derivatives, so a hit is the difference between seconds and minutes.
      # Split restore/save (rather than the combined actions/cache) because the
      # primary key changes on almost every push (content/blog hash): a plain
      # actions/cache would save a brand new entry each time and never reclaim
      # the last one, so a manual prune runs after save below.
      - id: astro-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .astro-cache
            .astro
          key: astro-${{ hashFiles('package-lock.json') }}-${{ hashFiles('content/blog/**') }}
          restore-keys: |
            astro-${{ hashFiles('package-lock.json') }}-
            astro-

      # npm 11 blocks install scripts by default; package.json allowlists the
      # one Astro actually needs (esbuild).
      - run: npm ci

      # `npm run build` = astro build + pagefind index. Nothing runs before it
      # any more: `npm run check`, the browser suite, Lighthouse and the link
      # check all moved to verify.yml, which runs beside this one instead of in
      # front of the deploy.
      - run: npm run build

      # Fails the run if any post still carries Ghost markup or a stray
      # component tag that never got a rule.
      - name: Check migrated output
        run: node scripts/check-output.ts

      # A manual run without the deploy box ticked builds and stops here. One
      # day of retention is enough since the only consumer is deploy-pages,
      # later in this same run.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'workflow_dispatch' || inputs.deploy
        with:
          path: dist
          retention-days: 1

      # Always attempt the save: a hit on the exact key above already skips
      # this (no-op, not an error), and, like the pre-split actions/cache,
      # this runs even if an earlier step failed.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: |
            .astro-cache
            .astro
          key: ${{ steps.astro-cache.outputs.cache-primary-key }}

      # The primary key above changes on almost every push, so without this
      # the cache entry from every push stays behind. Keep only the one this
      # run just saved for this branch.
      - name: Prune superseded Astro cache
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --key astro- --ref "${{ github.ref }}" --limit 100 --json id,key \
            --jq '.[] | select(.key != "${{ steps.astro-cache.outputs.cache-primary-key }}") | .id' \
            | while read -r id; do gh cache delete "$id"; done

  # The same condition upload-pages-artifact carries above: only a run that
  # produced the artifact can hand it to Pages.
  deploy:
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      # dist/ is about 300MB and the artifact exists only to reach this job.
      # Storage is billed for as long as an artifact is kept, so one day, the
      # shortest retention the upload accepts, still bills a day per push.
      # Removing it here bills minutes instead. Only on a successful deploy:
      # a failed one leaves the artifact so the deploy can be re-run alone.
      - name: Drop the pages artifact now the deploy has read it
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id' \
            | while read -r id; do gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"; done
