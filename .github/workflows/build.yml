name: Build

on:
  push:
    branches: [main]
  pull_request:
  # The Cloudflare Worker fires this at a scheduled post's exact pubDate.
  repository_dispatch:
    types: [scheduled-publish]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push wins; a half-finished run is never left going.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Builds and uploads the Pages artifact.
      - uses: withastro/action@v5

  # ponytail: no deploy job yet — the repo is private and Pages isn't enabled,
  # so actions/deploy-pages@v4 would only ever fail. Add it back at DNS cutover:
