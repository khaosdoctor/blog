name: Build

on:
  push:
    branches: [main]
  pull_request:
  # The Cloudflare Worker fires this at a scheduled post's exact pubDate.
  repository_dispatch:
    types: [scheduled-publish]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only a pull request cancels itself, and only its own runs. Everything else
# queues, because the Worker that fires scheduled-publish has a 60 second window
# and no persistence: cancel that run and the post simply never publishes.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the footer version is the last release tag plus
      # the number of commits since it, and a shallow checkout can see neither.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      # Astro's content and image caches. Image work dominates this build, 1400
      # webp derivatives, so a hit is the difference between seconds and minutes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules/.astro
            .astro
          key: astro-${{ hashFiles('package-lock.json') }}-${{ hashFiles('content/blog/**') }}
          restore-keys: |
            astro-${{ hashFiles('package-lock.json') }}-
            astro-

      # npm 11 blocks install scripts by default; package.json allowlists the
      # one Astro actually needs (esbuild).
      - run: npm ci

      # The build strips types without checking them, so a wrong i18n key or a
      # wrong prop ships silently as the string "undefined" in the page.
      - run: npm run check

      # `npm run build` = astro build + pagefind index.
      - run: npm run build

      # Fails the run if any post still carries Ghost markup or a stray
      # component tag that never got a rule.
      - name: Check migrated output
        run: node scripts/check-output.ts

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  # Advisory only, never a release blocker: a broken link in one of the
  # migrated posts or a Lighthouse regression is worth knowing about, not
  # worth stopping a deploy over. continue-on-error keeps this job's outcome
  # from affecting the workflow conclusion no matter what it finds, and it
  # runs off the artifact `build` already produced instead of building again.
  seo-audit:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    # Narrower than the workflow default: reading the artifact this run just
    # produced needs `actions: read`, which an explicit top-level permissions
    # block otherwise zeroes out, and this job has no business with pages
    # or id-token.
    permissions:
      contents: read
      actions: read
    steps:
      # Only lighthouserc.json is needed from the repo; the pages artifact
      # below is the actual site under test.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: github-pages

      # upload-pages-artifact tars the site root into artifact.tar, not a
      # `dist/` folder, so it has to be extracted back into one.
      - run: mkdir dist && tar -xf artifact.tar -C dist

      - name: Lighthouse
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      # --root-dir maps root-relative hrefs (the site uses only those) back to
      # dist/, so internal links resolve without a running server. External
      # links are checked too since a lot of the migrated posts still
      # point at six-year-old URLs.
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --no-progress --root-dir dist --exclude-mail 'dist/**/*.html'
          fail: false
          jobSummary: true

  # No deploy job yet, the repo is private and Pages isn't enabled,
  # so actions/deploy-pages@v4 would only ever fail. Add it back at DNS cutover:
  #
  #   deploy:
  #     needs: build
  #     runs-on: ubuntu-latest
  #     environment:
  #       name: github-pages
  #       url: ${{ steps.deploy.outputs.page_url }}
  #     steps:
  #       - id: deploy
  #         uses: actions/deploy-pages@v4
