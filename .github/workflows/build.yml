name: Build

# Off by hand until the DNS cutover, alongside the deploy job further down.
# Nothing here deploys yet, so a run costs minutes and storage and tells us what
# `npm run check` and `node scripts/check-output.ts` already say locally. Restore
# the two triggers below at the cutover, when a red build starts meaning
# something:
#
#   push:
#     branches: [main]
#     paths-ignore: ["docs/**"]   # docs never reach dist
#   pull_request:
#     paths-ignore: ["docs/**"]
on:
  # The Cloudflare Worker fires this at a scheduled post's exact pubDate.
  repository_dispatch:
    types: [scheduled-publish]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only a pull request cancels itself, and only its own runs. Everything else
# queues, because the Worker that fires scheduled-publish has a 60 second window
# and no persistence: cancel that run and the post simply never publishes.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # The astro-cache prune step below needs actions:write on top of the
    # workflow default.
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    steps:
      # Full history and tags: the footer version is the last release tag plus
      # the number of commits since it, and a shallow checkout can see neither.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # Astro's content and image caches. Image work dominates this build, 1400
      # webp derivatives, so a hit is the difference between seconds and minutes.
      # Split restore/save (rather than the combined actions/cache) because the
      # primary key changes on almost every push (content/blog hash): a plain
      # actions/cache would save a brand new entry each time and never reclaim
      # the last one, so a manual prune runs after save below.
      - id: astro-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules/.astro
            .astro
          key: astro-${{ hashFiles('package-lock.json') }}-${{ hashFiles('content/blog/**') }}
          restore-keys: |
            astro-${{ hashFiles('package-lock.json') }}-
            astro-

      # npm 11 blocks install scripts by default; package.json allowlists the
      # one Astro actually needs (esbuild).
      - run: npm ci

      # The build strips types without checking them, so a wrong i18n key or a
      # wrong prop ships silently as the string "undefined" in the page.
      - run: npm run check

      # `npm run build` = astro build + pagefind index.
      - run: npm run build

      # Fails the run if any post still carries Ghost markup or a stray
      # component tag that never got a rule.
      - name: Check migrated output
        run: node scripts/check-output.ts

      # Everything above reads the output as text. These drive a real browser
      # over the dist/ this job just built, which is the only way the layout
      # rules, the per-theme code colours and the progressive-enhancement
      # fallbacks are checked at all. Chrome only: the suite pins that channel.
      - name: Install Chrome for the end-to-end suite
        run: npx playwright install --with-deps chrome

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Advisory only, never a release blocker: a broken link in one of the
      # migrated posts or a Lighthouse regression is worth knowing about, not
      # worth stopping a deploy over. continue-on-error on each step keeps
      # neither tool from affecting the job's outcome no matter what it finds.
      # Runs against the dist/ this job already built instead of a second
      # build: it used to run in its own job downloading the pages artifact,
      # but that meant every run, including ones that can never deploy, had
      # to produce that artifact just to hand it to this step.
      - name: Lighthouse
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      # --root-dir maps root-relative hrefs (the site uses only those) back to
      # dist/, so internal links resolve without a running server. External
      # links are checked too since a lot of the migrated posts still
      # point at six-year-old URLs.
      - name: Check links
        continue-on-error: true
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --no-progress --root-dir dist --exclude-mail 'dist/**/*.html'
          fail: false
          jobSummary: true

      # Only a run that can actually deploy needs to hand dist/ off: PR runs
      # and manual dispatches build and check but stop here. One day of
      # retention is enough since the only consumer is deploy-pages, later in
      # this same run.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push' || github.event_name == 'repository_dispatch'
        with:
          path: dist
          retention-days: 1

      # Always attempt the save: a hit on the exact key above already skips
      # this (no-op, not an error), and, like the pre-split actions/cache,
      # this runs even if an earlier step failed.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: |
            node_modules/.astro
            .astro
          key: ${{ steps.astro-cache.outputs.cache-primary-key }}

      # The primary key above changes on almost every push, so without this
      # the cache entry from every push stays behind. Keep only the one this
      # run just saved for this branch.
      - name: Prune superseded Astro cache
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --key astro- --ref "${{ github.ref }}" --limit 100 --json id,key \
            --jq '.[] | select(.key != "${{ steps.astro-cache.outputs.cache-primary-key }}") | .id' \
            | while read -r id; do gh cache delete "$id"; done

  # No deploy job yet, the repo is private and Pages isn't enabled,
  # so actions/deploy-pages@v4 would only ever fail. Add it back at DNS cutover:
  #
  #   deploy:
  #     needs: build
  #     runs-on: ubuntu-latest
  #     environment:
  #       name: github-pages
  #       url: ${{ steps.deploy.outputs.page_url }}
  #     steps:
  #       - id: deploy
  #         uses: actions/deploy-pages@v4
