name: Build

on:
  push:
    branches: [main]
  pull_request:
  # The Cloudflare Worker fires this at a scheduled post's exact pubDate.
  repository_dispatch:
    types: [scheduled-publish]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push wins; a half-finished run is never left going.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the footer version counts posts published since
      # the last release tag, which a shallow checkout cannot see.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      # npm 11 blocks install scripts by default; package.json allowlists the
      # one Astro actually needs (esbuild).
      - run: npm ci

      # `npm run build` = astro build + pagefind index.
      - run: npm run build

      # Fails the run if any post still carries Ghost markup or a stray
      # component tag that never got a rule.
      - name: Check migrated output
        run: node scripts/check-output.ts

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  # No deploy job yet, the repo is private and Pages isn't enabled,
  # so actions/deploy-pages@v4 would only ever fail. Add it back at DNS cutover:
