name: Release

# Automatic. Every push to main reads the conventional commits since the last
# tag, bumps package.json, commits, tags, and creates a GitHub release. No PR
# step, no manual trigger needed (though you can still dispatch manually).
#
# feat -> minor, fix -> patch, BREAKING CHANGE / ! -> major.
# Commits that don't match (chore, docs, content, ci, etc.) are skipped.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version bump
        id: bump
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${LAST_TAG}..HEAD"
          fi

          BUMP=""
          CHANGELOG=""

          while IFS= read -r line; do
            # Skip empty lines and merge commits
            [ -z "$line" ] && continue

            subject=$(echo "$line" | sed 's/^[^ ]* //')
            hash=$(echo "$line" | awk '{print $1}')
            short=${hash:0:7}

            # Check for breaking change
            if echo "$subject" | grep -qE '^[a-z]+(\(.+\))?!:'; then
              BUMP="major"
              entry=$(echo "$subject" | sed 's/^[a-z]*\([^)]*\)\?!: //')
              CHANGELOG="${CHANGELOG}\n- **BREAKING:** ${entry} (${short})"
              continue
            fi

            type=$(echo "$subject" | grep -oE '^[a-z]+' || true)
            msg=$(echo "$subject" | sed 's/^[a-z]*\([^)]*\)\?: //')

            case "$type" in
              feat)
                [ "$BUMP" != "major" ] && BUMP="minor"
                CHANGELOG="${CHANGELOG}\n- ${subject} (${short})"
                ;;
              fix)
                [ -z "$BUMP" ] && BUMP="patch"
                CHANGELOG="${CHANGELOG}\n- ${subject} (${short})"
                ;;
              perf|refactor)
                [ -z "$BUMP" ] && BUMP="patch"
                CHANGELOG="${CHANGELOG}\n- ${subject} (${short})"
                ;;
            esac
          done < <(git log --format="%H %s" $RANGE)

          if [ -z "$BUMP" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No releasable commits since ${LAST_TAG:-the beginning}."
            exit 0
          fi

          CURRENT=$(jq -r .version package.json)
          IFS='.' read -r major minor patch <<< "$CURRENT"

          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          NEXT="${major}.${minor}.${patch}"
          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEXT}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          printf '%b' "$CHANGELOG" > /tmp/changelog.md
          echo "Bumping ${CURRENT} -> ${NEXT} (${BUMP})"

      - name: Bump, tag, and release
        if: steps.bump.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          jq --arg v "$VERSION" '.version = $v' package.json > package.tmp && mv package.tmp package.json
          git add package.json
          git commit -m "chore(release): v${VERSION}"
          git tag -a "$TAG" -m "v${VERSION}"
          git push origin main --follow-tags

          gh release create "$TAG" \
            --title "v${VERSION}" \
            --notes-file /tmp/changelog.md
