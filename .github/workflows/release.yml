name: Release

# Manual. Nothing here fires because a post was published.
#
# 1. When you want a release, run this workflow from the Actions tab.
#    release-please reads the conventional commits since the last tag and opens
#    (or refreshes) a "chore(main): release x.y.z" PR carrying the new version
#    and a changelog.
# 2. Merge that PR. The push trigger below matches only that merge commit, so
#    the tag and the GitHub release are created without you clicking again.
#
# Which commits move the version: feat -> minor, fix -> patch, a `!` or a
# BREAKING CHANGE footer -> major. Use `content:` for writing, which
# release-please ignores, so posts never inflate the number.
#
# Between releases the footer shows the semver plus a count of posts published
# since it, derived from git history by src/lib/version.ts, so that counter
# resets on its own when a new tag is created.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # On a manual run, always. On a push, only for the release PR merge, so an
    # ordinary push never opens a release PR on its own.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'chore(main): release')
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: node
