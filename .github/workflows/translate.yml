name: Translate

# Translates changed posts into English and opens a PR. Model output is
# untrusted, so it never goes straight to main.
#
# The work is scripts/translate.ts, the same script a local run uses. Which
# posts are stale, which are owned by a person, and what the prompt says all
# live there, so this file cannot drift from what happens on your machine.
#
# Auth is CLAUDE_CODE_OAUTH_TOKEN, generated locally with `claude setup-token`,
# billed against the Claude subscription rather than API credit. Without the
# secret the job exits clean instead of failing every push.

on:
  push:
    branches: [main]
    paths:
      - 'content/blog/**'
      # This job writes it, so reacting to it would start a run for its own output.
      - '!content/blog/.translation-cache.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: translate
  cancel-in-progress: false

jobs:
  # GITHUB_TOKEN is minted once per job, so read-only for the model means the
  # model gets a job of its own. It hands its output over as an artifact and
  # never holds a token that could write to the repo.
  translate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - name: Check for the token
        id: auth
        run: |
          if [ -z "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" ]; then
            echo "No CLAUDE_CODE_OAUTH_TOKEN secret set, skipping translation."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.auth.outputs.present == 'true'
        with:
          node-version: 26

      # The CLI is the whole dependency list: translate.ts otherwise imports only
      # node builtins and its own files, and it spawns `claude`, which reads
      # CLAUDE_CODE_OAUTH_TOKEN from the environment. No npm ci, no node_modules.
      - name: Install the Claude CLI
        if: steps.auth.outputs.present == 'true'
        run: npm i -g @anthropic-ai/claude-code

      - name: Translate changed posts
        if: steps.auth.outputs.present == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node scripts/translate.ts

      - name: Stage the produced translations
        id: diff
        if: steps.auth.outputs.present == 'true'
        run: |
          CHANGES=$(git status --porcelain content/blog)
          if [ -z "$CHANGES" ]; then
            echo "Nothing changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The model only ever adds or updates the translation beside a
          # post, never the source itself. A touched index file means it
          # edited a source post, which is not its job.
          if echo "$CHANGES" | cut -c4- | grep -qE '/index\.mdx?$'; then
            echo "::error::The model changed a source index.md(x) file. Refusing to hand this off."
            exit 1
          fi

          # Stage only the files that actually changed, keeping their
          # content/blog/... path, so the artifact carries a handful of
          # translation files rather than the whole (200+ MB) media library.
          STAGE="$RUNNER_TEMP/translations"
          mkdir -p "$STAGE"
          echo "$CHANGES" | cut -c4- | while IFS= read -r file; do
            mkdir -p "$STAGE/$(dirname "$file")"
            cp "$file" "$STAGE/$file"
          done

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"

      # The staged file set is the boundary: whatever else the model wrote to
      # the workspace is left behind here and never reaches the job that can
      # commit.
      - name: Hand the translations to the review job
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: translations
          path: ${{ steps.diff.outputs.stage }}
          if-no-files-found: error
          # .translation-cache.json is dot-prefixed, and the default excludes it.
          # Losing it would make the next run translate the same posts again.
          include-hidden-files: true
          # Unreviewed output, of no use past the next job in this same run.
          retention-days: 1

  # Our own code only, which is why this is the job that gets write access.
  review:
    needs: translate
    if: needs.translate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: automated-translations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      # check-translations.ts has no dependencies, so it needs a Node that
      # strips its types on its own rather than an npm ci.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      - name: Continue the existing translation branch, if there is one
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Committing on top of the remote tip is what keeps a reviewer's own
          # commits in history and makes the plain push below fast-forward.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch --no-tags origin "$BRANCH"
            git switch -c "$BRANCH" FETCH_HEAD
          else
            git switch -c "$BRANCH"
          fi

      - name: Fetch the translations
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: translations
          path: .

      # Ordered before the commit on purpose: unsafe markup never gets as far as
      # an object in the repository, let alone a branch someone might merge.
      - name: Reject unsafe markup before committing
        run: node scripts/check-translations.ts

      - name: Commit and open a PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.ref_name }}
        run: |
          if [ -z "$(git status --porcelain content/blog)" ]; then
            echo "Nothing left to commit once the branch is taken into account."
            exit 0
          fi
          git add content/blog
          git commit -m "content: update machine translations"
          # Never --force. A rejection means someone pushed to the branch after
          # this job read it, and their commits are worth more than this run.
          if ! git push origin "$BRANCH"; then
            echo "::error::Push to $BRANCH was rejected, so someone pushed there while this run was working. Nothing was overwritten. Merge or close that PR, then run this workflow again."
            exit 1
          fi
          # --state open, because `gh pr view` answers for a merged PR too, and
          # a branch left behind after a merge would then never get a new one.
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base "$BASE" --head "$BRANCH" \
              --title "content: update machine translations" \
              --body "Generated translation output. Review before merging."
          fi
