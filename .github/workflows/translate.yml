name: Translate

# Translates changed posts into English and opens a PR. Model output is
# untrusted, so it never goes straight to main.
#
# Auth is CLAUDE_CODE_OAUTH_TOKEN, generated locally with `claude setup-token`,
# billed against the Claude subscription rather than API credit. Without the
# secret the job exits clean instead of failing every push.

on:
  push:
    branches: [main]
    paths:
      - 'content/blog/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: translate
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 2

      - name: Check for the token
        id: auth
        run: |
          if [ -z "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" ]; then
            echo "No CLAUDE_CODE_OAUTH_TOKEN secret set, skipping translation."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Translate changed posts
        if: steps.auth.outputs.present == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Translate every post under content/blog changed in the last commit
            into English, writing each to content/translated/<slug>/index.mdx.

            - Keep the frontmatter fields. Translate title and description only.
            - Set lang: en, machineTranslated: true, translationOf: <slug>.
            - Do not translate code blocks, identifiers, or inline code spans.
            - Keep every link, image path and embed exactly as it is.
            - Leave a file alone if it already has machineTranslated: false.
              A human edited it and their version wins.
            - Do not touch anything outside content/translated.

      - name: Open a PR with the translations
        if: steps.auth.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain content/translated)" ]; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="automated-translations"
          git checkout -B "$BRANCH"
          git add content/translated
          git commit -m "content: update machine translations"
          git push --force origin "$BRANCH"
          if ! gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr create --base "${{ github.ref_name }}" --head "$BRANCH" \
              --title "content: update machine translations" \
              --body "Generated translation output. Review before merging."
          fi
